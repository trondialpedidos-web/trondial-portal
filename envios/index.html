<script>
/* ============ ESTADO EN MEMORIA (simula backend) ============ */
let session = null; // null (pantalla de login) | { role:'admin' } | { role:'repartidor', repartidorId }
let adminTab = 'pedidos'; // pedidos | noentregados | reportes | repartidores
let offlineMode = false;
let pendingSync = [];

// Los clientes ya no van escritos en el código: viven en Firestore (se copiaron del sistema anterior).
const CLIENTES_SEED = [];

function buildDefaultClientes(){ return CLIENTES_SEED.map(c => ({ id:c[0], nombre:c[1], direccion:c[2], telefono:c[3], nota:c[4] })); }

const DEFAULT_REPARTIDORES = [
  { id: 'r1', nombre: 'Diego Fernández' },
  { id: 'r2', nombre: 'Lucía Pereyra' },
  { id: 'r3', nombre: 'Martín Ocampo' },
  { id: 'r4', nombre: 'Valentina Suárez' },
  { id: 'r5', nombre: 'Nicolás Beltrán' },
  { id: 'r6', nombre: 'Camila Rossi' },
];

const state = {
  repartidores: [],
  clientesDB: [],
  pedidos: [],
  comprobantes: [],
  intentos: [],
  ubicaciones: [],
  pedidosWebPendientes: [], // borradores de pedidos web que llegaron automáticamente por mail (script de correo), pendientes de revisión
};

function uid(p){ return p + '_' + Math.random().toString(36).slice(2,9); }
function hoy(offsetDias){ const d = new Date(); d.setDate(d.getDate() + (offsetDias||0)); return d; }
function fmtFecha(d){ if(!d) return '—'; const dt = new Date(d); return dt.toLocaleDateString('es-UY',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' + dt.toLocaleTimeString('es-UY',{hour:'2-digit',minute:'2-digit'}); }
function esHoy(d){ if(!d) return false; const x = new Date(d); const t = new Date(); return x.toDateString() === t.toDateString(); }
function fechaKey(d){ const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); }
function hoyKey(){ return fechaKey(new Date()); }

function seed(){
  const direcciones = [
    'Av. 18 de Julio 1234, Montevideo','Bulevar Artigas 2456, Montevideo','Rambla República del Perú 3200, Montevideo',
    'Av. Italia 3300, Montevideo','Colón 987, Ciudad Vieja','Av. Rivera 4500, Montevideo','Av. Millán 4120, Montevideo',
    '8 de Octubre 3050, Montevideo','Luis Alberto de Herrera 1050, Montevideo','Bvar. España 2350, Montevideo',
    'Av. Sarmiento 550, Montevideo','Camino Maldonado 5200, Montevideo','Av. Garzón 3200, Montevideo','José Batlle y Ordóñez 2200, Montevideo'
  ];
  const nombres = ['Rodrigo Silva','Ana Methol','Federico Larre','Sofía Cabrera','Gonzalo Píriz','María Noel Correa','Bruno Antúnez','Carolina Wagner','Emiliano Duarte','Julieta Bermúdez','Pablo Machado','Rocío Alonso','Ignacio Ferreira','Agustina Bove'];
  let n = 1001;
  const estadosIniciales = ['pendiente','pendiente','pendiente','encamino','encamino','entregado','entregado','entregado','entregado','noentregado','pendiente','pendiente','entregado','pendiente'];
  const modalidades = ['web','web','web','web','web','web','web','mayorista','mayorista','mayorista','mayorista','mayorista','mayorista','mayorista'];
  const loteId = uid('lote');
  for(let i=0;i<14;i++){
    const rep = state.repartidores[i % state.repartidores.length];
    const pedido = {
      id: uid('ped'),
      numero: 'PED-' + (n++),
      modalidad: modalidades[i],
      cliente: nombres[i],
      direccion: direcciones[i],
      telefono: '09' + Math.floor(1000000 + Math.random()*8999999),
      repartidorId: rep.id,
      estado: estadosIniciales[i],
      bultos: modalidades[i] === 'mayorista' ? (2 + (i % 5)) : null,
      pallets: modalidades[i] === 'mayorista' ? (i % 3) : null,
      loteId: modalidades[i] === 'mayorista' ? loteId : null,
      createdAt: hoy(0).toISOString(),
      fechaEnvio: fechaKey(hoy(0)),
    };
    state.pedidos.push(pedido);
    if(pedido.estado === 'entregado'){
      state.comprobantes.push({ id: uid('cmp'), pedidoId: pedido.id, nombreReceptor: nombres[(i+3)%nombres.length], cedulaReceptor: (4000000+i*137).toString()+'-'+(i%9), fechaHora: hoy(0).toISOString() });
    }
    if(pedido.estado === 'noentregado'){
      state.intentos.push({ id: uid('int'), pedidoId: pedido.id, motivo: 'Cliente ausente', fechaHora: hoy(0).toISOString(), repartidorId: rep.id, resolucion: null });
    }
  }

  // Historial de días anteriores, para poder filtrar reportes por fecha
  const nombresHist = ['Walter Casas','Belén Suárez','Ramiro Godoy','Lorena Ibáñez','Federico Pintos','Daniela Recoba','Esteban Núñez','Yamila Cardozo'];
  const direccionesHist = ['Av. Brasil 2100, Montevideo','Comercio 1450, Montevideo','Av. Gral Flores 3210, Montevideo','Rambla T. Berreta 4800, Montevideo','Av. Centenario 3900, Montevideo','Bvar. Batlle y Ordóñez 2900, Montevideo'];
  for(let d=1; d<=9; d++){
    const pedidosDelDia = 2 + (d % 3);
    for(let j=0; j<pedidosDelDia; j++){
      const rep = state.repartidores[(d+j) % state.repartidores.length];
      const esAnulado = (d+j) % 5 === 0;
      const pedido = {
        id: uid('ped'),
        numero: 'PED-' + (n++),
        modalidad: (d+j) % 3 === 0 ? 'mayorista' : 'web',
        cliente: nombresHist[(d+j) % nombresHist.length],
        direccion: direccionesHist[(d+j) % direccionesHist.length],
        telefono: '09' + Math.floor(1000000 + Math.random()*8999999),
        repartidorId: rep.id,
        estado: esAnulado ? 'anulado' : 'entregado',
        bultos: (d+j) % 3 === 0 ? (1 + ((d+j) % 6)) : null,
        pallets: (d+j) % 3 === 0 ? ((d+j) % 3) : null,
        loteId: null,
        createdAt: hoy(-d).toISOString(),
        fechaEnvio: fechaKey(hoy(-d)),
        historico: true,
      };
      state.pedidos.push(pedido);
      if(pedido.estado === 'entregado'){
        state.comprobantes.push({ id: uid('cmp'), pedidoId: pedido.id, nombreReceptor: nombresHist[(d+j+2) % nombresHist.length], cedulaReceptor: (3500000 + d*111 + j*7).toString()+'-'+((d+j)%9), fechaHora: hoy(-d).toISOString() });
      } else {
        state.intentos.push({ id: uid('int'), pedidoId: pedido.id, motivo: (d%2===0)?'Cliente ausente':'Dirección incorrecta', fechaHora: hoy(-d).toISOString(), repartidorId: rep.id, resolucion: 'Anulado' });
      }
    }
  }
}
/* ============ FIREBASE / SINCRONIZACIÓN EN TIEMPO REAL ============
   Reemplaza el almacenamiento local (localStorage) por Cloud Firestore:
   todos los dispositivos (administrador y repartidores) leen y escriben
   la misma base de datos compartida, en tiempo real. */
const firebaseConfig = {
  apiKey: "AIzaSyAA1nEPhtZ5s8TD3wATBOvI5vW0lFEu3KU",
  authDomain: "trondial-portal.firebaseapp.com",
  projectId: "trondial-portal",
  storageBucket: "trondial-portal.firebasestorage.app",
  messagingSenderId: "116037416042",
  appId: "1:116037416042:web:efd4862444a1c41ea2c613"
};
let perfilPortal = null;   // ficha del usuario en el portal (/usuarios/{uid})
let sinAcceso = false;      // true si el usuario no tiene permiso en Envíos (o fue desactivado)
let unsubsSync = [];        // listeners activos de Firestore, para cortarlos al cambiar de usuario
let diaSync = null;         // día con el que se armaron los listeners del repartidor
let fbEnabled = false;
let db = null;
let clientesMigracionIntentada = false;

function esInputDeTextoActivo(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = el.tagName;
  if(tag === 'TEXTAREA') return true;
  if(tag === 'INPUT'){
    const t = (el.type||'text').toLowerCase();
    return ['text','search','tel','password','number'].includes(t);
  }
  return false;
}
function renderAllSync(){
  // Evita interrumpir a alguien que está escribiendo cuando llega una actualización de otro dispositivo
  if(esInputDeTextoActivo()) return;
  // Evita destruir y recrear el mapa (Leaflet) cada vez que llega una actualización de OTRA
  // colección mientras el admin está mirando la pestaña Mapa. El mapa se actualiza aparte,
  // directo, vía el listener de 'ubicaciones' -> actualizarMapaAdmin().
  if(session && session.role==='admin' && adminTab==='mapa') return;
  renderAll();
}

function fsSet(coleccion, entidad){
  if(!fbEnabled || !db || !entidad || !entidad.id) return;
  db.collection(coleccion).doc(entidad.id).set(entidad).catch(err=>{
    console.error('Error guardando en '+coleccion, err);
    showToast('No se pudo sincronizar con el servidor. Revisá tu conexión.','err');
  });
}
// Actualiza solo algunos campos (lo usa el repartidor: las reglas no le dejan tocar otra cosa).
function fsUpdate(coleccion, id, campos){
  if(!fbEnabled || !db || !id) return;
  db.collection(coleccion).doc(id).update(campos).catch(err=>{
    console.error('Error actualizando '+coleccion, err);
    showToast('No se pudo sincronizar con el servidor. Revisá tu conexión.','err');
  });
}
function fsDelete(coleccion, id){
  if(!fbEnabled || !db || !id) return;
  db.collection(coleccion).doc(id).delete().catch(err=> console.error('Error eliminando de '+coleccion, err));
}
function fsActualizarUbicacion(repId, lat, lng){
  if(!fbEnabled || !db || !repId) return;
  const fecha = hoyKey();
  const punto = { lat, lng, ts: new Date().toISOString() };
  const docId = repId + '_' + fecha;
  db.collection('ubicaciones').doc(docId).set({
    repartidorId: repId,
    fecha,
    actual: punto,
    historial: firebase.firestore.FieldValue.arrayUnion(punto),
  }, { merge: true }).catch(err=> console.error('Error guardando ubicación', err));
}
function fsBatchSet(coleccion, entidades){
  if(!fbEnabled || !db || !entidades || entidades.length===0) return Promise.resolve();
  const lotes = [];
  for(let i=0;i<entidades.length;i+=450){ lotes.push(entidades.slice(i,i+450)); }
  return lotes.reduce((prev, lote) => prev.then(()=>{
    const batch = db.batch();
    lote.forEach(e=> batch.set(db.collection(coleccion).doc(e.id), e));
    return batch.commit();
  }), Promise.resolve()).catch(err=> console.error('Error en carga masiva de '+coleccion, err));
}
function fsBatchDeleteAll(coleccion){
  if(!fbEnabled || !db) return Promise.resolve();
  return db.collection(coleccion).get().then(snap=>{
    const ids = snap.docs.map(d=>d.id);
    const lotes = [];
    for(let i=0;i<ids.length;i+=450){ lotes.push(ids.slice(i,i+450)); }
    return lotes.reduce((prev, lote) => prev.then(()=>{
      const batch = db.batch();
      lote.forEach(id => batch.delete(db.collection(coleccion).doc(id)));
      return batch.commit();
    }), Promise.resolve());
  }).catch(err=> console.error('Error borrando '+coleccion, err));
}

// El ingreso lo hace el Portal (correo y contraseña). Acá solo se lee quién es y qué permiso
// tiene en Envíos. Si no inició sesión, se lo manda al Portal.
function irAlPortal(){ location.href = '../'; }
function iniciarFirebase(){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs:true }).catch(()=>{});
    fbEnabled = true;
    let unsubPerfil = null;
    firebase.auth().onAuthStateChanged(user=>{
      if(unsubPerfil){ unsubPerfil(); unsubPerfil = null; }
      if(!user || user.isAnonymous){ irAlPortal(); return; }
      unsubPerfil = db.collection('usuarios').doc(user.uid).onSnapshot(doc=>{
        perfilPortal = doc.exists ? doc.data() : null;
        const u = perfilPortal;
        const nivel = (u && u.activo) ? (u.dueno ? 'admin' : ((u.permisos||{}).envios || '')) : '';
        let nueva = null;
        if(nivel === 'admin') nueva = { role:'admin' };
        else if(nivel === 'repartidor' && u.repartidorId) nueva = { role:'repartidor', repartidorId:u.repartidorId };
        if(!nueva){ quitarAcceso(); return; }
        const cambio = !session || session.role !== nueva.role || session.repartidorId !== nueva.repartidorId;
        session = nueva; sinAcceso = false;
        if(cambio){
          detenerSincronizacion(); iniciarSincronizacion();
          if(session.role === 'repartidor') iniciarRastreoUbicacion(); else detenerRastreoUbicacion();
        }
        renderAll();
      }, err=>{ console.error('Error leyendo el perfil', err); quitarAcceso(); });
    });
  }catch(err){
    console.error('Error inicializando Firebase', err);
    showToast('No se pudo inicializar la conexión con el servidor.','err');
  }
}
function quitarAcceso(){
  detenerSincronizacion(); detenerRastreoUbicacion();
  session = null; sinAcceso = true;
  state.pedidos = []; state.comprobantes = []; state.intentos = []; state.ubicaciones = []; state.pedidosWebPendientes = [];
  renderAll();
}
function detenerSincronizacion(){ unsubsSync.forEach(f=>{ try{ f(); }catch(e){} }); unsubsSync = []; }

function iniciarSincronizacion(){
  const esAdmin = session.role === 'admin';
  const repId = session.repartidorId;
  diaSync = hoyKey();
  const escuchar = (consulta, nombre, alRecibir) => {
    unsubsSync.push(consulta.onSnapshot(alRecibir, err=> console.error('Error escuchando '+nombre, err)));
  };

  escuchar(db.collection('repartidores'), 'repartidores', snap=>{
    state.repartidores = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    renderAllSync();
  });

  // El administrador ve todo. El repartidor solo recibe SUS registros de HOY:
  // Firestore no le entrega nada de otros choferes (lo controlan las reglas de seguridad).
  const pedidosQ = esAdmin ? db.collection('pedidos')
    : db.collection('pedidos').where('repartidorId','==',repId).where('fechaEnvio','==',diaSync);
  const comprobantesQ = esAdmin ? db.collection('comprobantes')
    : db.collection('comprobantes').where('repartidorId','==',repId).where('fecha','==',diaSync);
  const intentosQ = esAdmin ? db.collection('intentos')
    : db.collection('intentos').where('repartidorId','==',repId).where('fecha','==',diaSync);

/* ============ VALIDACIÓN CÉDULA URUGUAYA ============ */
function validarCedulaUY(raw){
  const digits = (raw||'').replace(/\D/g,'');
  if(digits.length < 7 || digits.length > 8) return { valido:false, motivo:'Debe tener 7 u 8 dígitos.' };
  const base = digits.length === 8 ? digits.slice(0,7) : ('0'+digits).slice(-7);
  const dv = digits.length === 8 ? parseInt(digits.slice(7),10) : null;
  const pesos = [2,9,8,7,6,3,4];
  let suma = 0;
  for(let i=0;i<7;i++){ suma += parseInt(base[i],10) * pesos[i]; }
  const resto = suma % 10;
  const dvCalc = resto === 0 ? 0 : 10 - resto;
  if(dv === null) return { valido:true, motivo:'Formato aceptado (sin dígito verificador para chequear).' };
  if(dv !== dvCalc) return { valido:false, motivo:'El dígito verificador no coincide (¿'+dvCalc+'?).' };
  return { valido:true, motivo:'Cédula válida.' };
}

// Ubicación del repartidor en segundo plano (para el mapa del administrador)
let watchIdUbicacion = null;
let ultimoEnvioUbicacion = 0;
const INTERVALO_UBICACION_MS = 25000; // no mandar más seguido que cada ~25s (batería y cuota de Firestore)
function iniciarRastreoUbicacion(){
  if(watchIdUbicacion !== null) return; // ya está corriendo
  if(!navigator.geolocation) return;
  watchIdUbicacion = navigator.geolocation.watchPosition(
    pos=>{
      const ahora = Date.now();
      if(ahora - ultimoEnvioUbicacion < INTERVALO_UBICACION_MS) return;
      ultimoEnvioUbicacion = ahora;
      const repId = session && session.role==='repartidor' ? session.repartidorId : null;
      if(!repId) return;
      fsActualizarUbicacion(repId, pos.coords.latitude, pos.coords.longitude);
    },
    err=>{ console.warn('No se pudo obtener la ubicación en segundo plano', err); },
    { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 }
  );
}
function detenerRastreoUbicacion(){
  if(watchIdUbicacion === null) return;
  if(navigator.geolocation) navigator.geolocation.clearWatch(watchIdUbicacion);
  watchIdUbicacion = null;
}
function capturarUbicacionPuntual(callback){
  if(!navigator.geolocation){ callback(null); return; }
  navigator.geolocation.getCurrentPosition(
    pos=> callback({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
    err=>{ console.warn('No se pudo obtener la ubicación puntual', err); callback(null); },
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
  );
}

let mapaLeaflet = null;
let marcadoresChoferes = {};
let recorridosChoferes = {}; // repId -> polyline, solo de los choferes con el recorrido activado
let coloresChoferes = {}; // repId -> color asignado (estable durante la sesión)
const PALETA_COLORES_MAPA = ['#2563eb','#dc2626','#059669','#d97706','#7c3aed','#db2777','#0891b2','#65a30d'];
function colorDeChofer(repId){
  if(!coloresChoferes[repId]){
    const idx = Object.keys(coloresChoferes).length % PALETA_COLORES_MAPA.length;
    coloresChoferes[repId] = PALETA_COLORES_MAPA[idx];
  }
  return coloresChoferes[repId];
}

function actualizarMapaAdmin(){
  if(adminTab!=='mapa') return;
  const cont = document.getElementById('mapaAdmin');
  if(!cont || typeof L === 'undefined') return;

  // Si el contenedor se recreó (por ejemplo, se volvió a renderizar la pestaña), el mapa
  // Leaflet anterior queda apuntando a un div fuera del DOM: hay que tirarlo y crear uno nuevo.
  if(mapaLeaflet && mapaLeaflet.getContainer() !== cont){
    mapaLeaflet.remove();
    mapaLeaflet = null;
    marcadoresChoferes = {};
    recorridosChoferes = {};
  }

  if(!mapaLeaflet){
    mapaLeaflet = L.map(cont).setView([-34.9011, -56.1645], 12); // Montevideo, por defecto
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(mapaLeaflet);
    marcadoresChoferes = {};
    recorridosChoferes = {};
  }

  const hoy = hoyKey();
  const activos = (state.ubicaciones||[]).filter(u=>u.fecha===hoy && u.actual);
  const idsActivos = new Set(activos.map(u=>u.repartidorId));

  Object.keys(marcadoresChoferes).forEach(repId=>{
    if(!idsActivos.has(repId)){ mapaLeaflet.removeLayer(marcadoresChoferes[repId]); delete marcadoresChoferes[repId]; }
  });
  Object.keys(recorridosChoferes).forEach(repId=>{
    if(!idsActivos.has(repId)){ mapaLeaflet.removeLayer(recorridosChoferes[repId]); delete recorridosChoferes[repId]; }
  });

  const puntos = [];
  activos.forEach(u=>{
    const repId = u.repartidorId;
    const nombre = repartidorNombre(repId);
    const latlng = [u.actual.lat, u.actual.lng];
    puntos.push(latlng);
    const minutosAtras = Math.max(0, Math.round((Date.now() - new Date(u.actual.ts).getTime())/60000));
    const popup = `<b>${nombre}</b><br>Actualizado hace ${minutosAtras<1?'instantes':minutosAtras+' min'}`;
    if(marcadoresChoferes[repId]){
      marcadoresChoferes[repId].setLatLng(latlng).setPopupContent(popup);
    } else {
      marcadoresChoferes[repId] = L.marker(latlng).addTo(mapaLeaflet).bindPopup(popup);
    }
    if(recorridosChoferes[repId]){
      const historial = (u.historial||[]).slice().sort((a,b)=> new Date(a.ts)-new Date(b.ts));
      recorridosChoferes[repId].setLatLngs(historial.map(h=>[h.lat,h.lng]));
    }
  });

  Object.values(recorridosChoferes).forEach(linea=>{
    linea.getLatLngs().forEach(ll=> puntos.push([ll.lat, ll.lng]));
  });

  if(puntos.length){
    mapaLeaflet.fitBounds(puntos, { padding:[40,40], maxZoom:15 });
  }

  const leyenda = document.getElementById('mapaLeyenda');
  if(leyenda){
    if(activos.length===0){
      leyenda.innerHTML = '<span class="text-xs text-slate-400">Ningún chofer compartió su ubicación todavía hoy.</span>';
    } else {
      leyenda.innerHTML = activos.map(u=>{
        const repId = u.repartidorId;
        const color = colorDeChofer(repId);
        const mostrando = !!recorridosChoferes[repId];
        return `<button onclick="toggleRecorridoChofer('${repId}')" class="flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1.5 rounded-lg border ${mostrando?'border-slate-300 bg-slate-50':'border-slate-200'}">
          <span class="w-2.5 h-2.5 rounded-full inline-block" style="background:${color}"></span>
          ${repartidorNombre(repId)}
          <span class="text-slate-400 font-normal">${mostrando?'· ocultar recorrido':'· ver recorrido'}</span>
        </button>`;
      }).join('');
    }
  }
}
function toggleRecorridoChofer(repId){
  if(!mapaLeaflet) return;
  if(recorridosChoferes[repId]){
    mapaLeaflet.removeLayer(recorridosChoferes[repId]);
    delete recorridosChoferes[repId];
  } else {
    const u = (state.ubicaciones||[]).find(x=>x.repartidorId===repId && x.fecha===hoyKey());
    if(!u || !u.historial || u.historial.length===0){
      showToast('Todavía no hay recorrido registrado para ese chofer hoy.','info');
      return;
    }
    const historial = u.historial.slice().sort((a,b)=> new Date(a.ts)-new Date(b.ts));
    const color = colorDeChofer(repId);
    recorridosChoferes[repId] = L.polyline(historial.map(h=>[h.lat,h.lng]), { color, weight:4, opacity:0.75 }).addTo(mapaLeaflet);
  }
  actualizarMapaAdmin();
}

/* ============ PAGINACIÓN (listas del administrador, sin scroll infinito) ============ */
const ADMIN_PAGE_SIZE = 20;

function paginar(lista, pagina){
  const totalPaginas = Math.max(1, Math.ceil(lista.length / ADMIN_PAGE_SIZE));
  const paginaActual = Math.min(Math.max(1, pagina||1), totalPaginas);
  const start = (paginaActual - 1) * ADMIN_PAGE_SIZE;
  return { items: lista.slice(start, start + ADMIN_PAGE_SIZE), totalPaginas, paginaActual, total: lista.length };
}
function paginacionHtml(totalPaginas, paginaActual, total, onClickFn, extraArgs){
  if(totalPaginas <= 1 || total === 0) return '';
  const desde = (paginaActual-1)*ADMIN_PAGE_SIZE + 1;
  const hasta = Math.min(paginaActual*ADMIN_PAGE_SIZE, total);
  const args = extraArgs ? extraArgs+', ' : '';
  let start = Math.max(1, paginaActual - 2);
  let end = Math.min(totalPaginas, start + 4);
  start = Math.max(1, end - 4);
  const paginas = [];
  for(let i=start;i<=end;i++) paginas.push(i);
  const btn = (p, label, disabled, active) => `<button type="button" ${disabled?'disabled':''} onclick="${onClickFn}(${args}${p})" class="min-w-[26px] h-7 px-1.5 rounded-lg text-xs font-semibold ${active?'bg-brand-700 text-white':'text-slate-500 hover:bg-slate-100'} ${disabled?'opacity-30 pointer-events-none':''}">${label}</button>`;
  return `<div class="flex flex-wrap items-center justify-between gap-2 px-4 py-3 border-t border-slate-100">
    <span class="text-xs text-slate-400">Mostrando ${desde}–${hasta} de ${total}</span>
    <div class="flex items-center gap-1">
      ${btn(paginaActual-1, '‹', paginaActual<=1, false)}
      ${start>1 ? btn(1,'1',false,false) + (start>2?'<span class="px-1.5 text-slate-300 text-xs">…</span>':'') : ''}
      ${paginas.map(p=>btn(p, String(p), false, p===paginaActual)).join('')}
      ${end<totalPaginas ? (end<totalPaginas-1?'<span class="px-1.5 text-slate-300 text-xs">…</span>':'') + btn(totalPaginas, String(totalPaginas), false, false) : ''}
      ${btn(paginaActual+1, '›', paginaActual>=totalPaginas, false)}
    </div>
  </div>`;
}

function motivoDePedido(p){
  const intento = [...state.intentos].reverse().find(i=>i.pedidoId===p.id);

}

function detallePedidoHtml(p, colspan){

    </div>`;

      <td colspan="${colspan}" class="px-4 py-3">
        <div class="grid sm:grid-cols-2 gap-3 text-sm">
          <div class="space-y-1 text-slate-600">

function guardarEdicionPedido(e, id){
  e.preventDefault();
  const p = state.pedidos.find(x=>x.id===id); if(!p) return;
  const f = new FormData(e.target);
  const nuevaFecha = f.get('fechaEnvio');
  if(nuevaFecha) p.fechaEnvio = nuevaFecha;
  if(p.modalidad==='mayorista'){
    p.bultos = parseInt(f.get('bultos'),10) || 1;
    p.pallets = parseInt(f.get('pallets'),10) || 0;
  }
  p.barrio = (f.get('barrio')||'').trim();
  p.observaciones = (f.get('observaciones')||'').trim();
  fsSet('pedidos', p);
  closeModal();
  showToast('Pedido '+p.numero+' actualizado.');
  renderAdminTabContent();
}

/* ============ PEDIDOS WEB POR REVISAR (borradores que llegan automáticamente por mail) ============
   El script de correo (Apps Script) detecta los mails de "Nuevo pedido" en pedidos@trondial.uy, extrae los datos y los deja
   como borrador en la colección pedidosWebPendientes de Firestore (ver firestore.rules: esa
   colección acepta que cualquiera con el "secreto" correcto agregue un borrador, pero nadie de
   afuera puede leerlos ni tocar los que ya existen). Acá el admin los revisa uno por uno: puede
   confirmarlos (se convierten en un pedido real, como los que se cargan a mano) o descartarlos
   (por ejemplo, si son duplicados o se cancelaron). */
function renderWebPendientesTab(){
  const borradores = state.pedidosWebPendientes.slice().sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));

  return `<div class="flex justify-end mb-3">

          <span class="text-xs font-bold text-amber-700 bg-amber-50 border border-amber-200 rounded-full px-2 py-0.5">Por revisar</span>

        </div>
        <div class="font-bold text-slate-800">${b.cliente || '(sin nombre)'}</div>
        <div class="text-sm text-slate-600 mt-1">${b.direccion || '—'}</div>
        <div class="text-sm text-slate-500">${b.telefono || '—'}</div>
        ${b.observaciones ? `<div class="text-xs text-amber-700 bg-amber-50 border border-amber-100 rounded-lg px-2 py-1.5 mt-2">${b.observaciones}</div>` : ''}
        ${b.montoTotal ? `<div class="text-xs text-slate-400 mt-2">Total: ${b.montoTotal}</div>` : ''}
        <div class="flex gap-2 mt-3">
          <button onclick="abrirRevisarPedidoWebModal('${b.id}')" class="flex-1 px-3 py-2 rounded-lg bg-brand-700 hover:bg-brand-800 text-white text-xs font-semibold">Revisar y crear pedido</button>
          <button onclick="confirmDescartarPedidoWeb('${b.id}')" title="Descartar" class="px-2.5 py-2 rounded-lg border border-slate-300 text-slate-500 hover:bg-slate-50"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>
      </div>
    `).join('')}
  </div>`;
}

function crearPedidoDesdeBorrador(e, id){
  e.preventDefault();
  const f = new FormData(e.target);
  const numero = siguienteNumeroPedido();
  const fechaEnvio = f.get('fechaEnvio') || hoyKey();
  const observaciones = (f.get('observaciones')||'').trim();
  const nuevoPedido = { id: uid('ped'), numero, cliente: f.get('cliente'), direccion: f.get('direccion'), telefono: f.get('telefono'), modalidad:'web', bultos:null, pallets:null, observaciones, repartidorId: f.get('repartidorId'), estado:'pendiente', loteId:null, createdAt: new Date().toISOString(), fechaEnvio };
  state.pedidos.push(nuevoPedido);
  fsSet('pedidos', nuevoPedido);
  autocompletarBarrio_(nuevoPedido);
  state.pedidosWebPendientes = state.pedidosWebPendientes.filter(x=>x.id!==id);
  fsDelete('pedidosWebPendientes', id);
  closeModal();
  showToast('Pedido '+numero+' creado y asignado.');
  renderAdmin();
}

function generarEtiquetaPDF(id){
  const p = state.pedidos.find(x=>x.id===id); if(!p) return;
  if(typeof QRCode === 'undefined' || !window.jspdf){
    showToast('No se pudo generar la etiqueta: revisá tu conexión a internet e intentá de nuevo.','err');
    return;
  }
  let qrHost = document.getElementById('qrTempHost');
  if(!qrHost){
    qrHost = document.createElement('div');
    qrHost.id = 'qrTempHost';
    qrHost.style.cssText = 'position:fixed; left:-9999px; top:-9999px;';
    document.body.appendChild(qrHost);
  }
  qrHost.innerHTML = '';
  try{
    new QRCode(qrHost, { text: p.numero, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M });
  }catch(err){
    console.error('Error generando QR', err);
    construirPdfEtiqueta(p, null);
    return;
  }
  setTimeout(()=>{
    const canvas = qrHost.querySelector('canvas');
    let qrDataUrl = null;
    try{ qrDataUrl = canvas ? canvas.toDataURL('image/png') : null; }catch(err){ console.error('Error leyendo QR', err); }
    construirPdfEtiqueta(p, qrDataUrl);
  }, 120);
}
function construirPdfEtiqueta(p, qrDataUrl){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'portrait', unit:'cm', format:[10,15] });
    const anchoPagina = 10;
    const margen = 0.7;
    const anchoUtil = anchoPagina - margen*2;
    doc.setLineWidth(0.03);

    /* ---- Encabezado: logo + datos de la empresa ---- */
    const logoSize = 1.7;
    try{ doc.addImage(LOGO_TRONDIAL_B64, 'PNG', margen, margen, logoSize, logoSize); }catch(e){ console.warn('No se pudo dibujar el logo', e); }

    const xTexto = margen + logoSize + 0.3;
    let yTexto = margen + 0.38;
    doc.setFont('helvetica','bold');
    doc.setFontSize(11);
    doc.text(EMPRESA_NOMBRE, xTexto, yTexto);
    yTexto += 0.4;
    doc.setFont('helvetica','normal');
    doc.setFontSize(8);
    doc.text(EMPRESA_DIRECCION, xTexto, yTexto);
    yTexto += 0.34;
    doc.text(EMPRESA_TEL, xTexto, yTexto);
    yTexto += 0.34;
    doc.setFont('helvetica','bold');
    doc.text('Pedido: '+p.numero, xTexto, yTexto);

    const yFinEncabezado = margen + logoSize + 0.25;
    doc.line(margen, yFinEncabezado, anchoPagina-margen, yFinEncabezado);

    /* ---- Fila: WEB | Fecha grande ---- */
    const yFilaTop = yFinEncabezado;
    const yFilaBottom = yFilaTop + 1.15;
    const xMedio = anchoPagina/2;
    doc.line(xMedio, yFilaTop, xMedio, yFilaBottom);

    doc.setFont('helvetica','bold');
    doc.setFontSize(22);
    doc.text('WEB', margen+0.15, yFilaTop+0.78);

    const fechaObj = p.fechaEnvio ? new Date(p.fechaEnvio+'T00:00:00') : new Date();
    const fechaGrande = fechaObj.getDate()+' '+MESES_ABREV[fechaObj.getMonth()];
    doc.text(fechaGrande, anchoPagina-margen-0.15, yFilaTop+0.78, { align:'right' });

    doc.line(margen, yFilaBottom, anchoPagina-margen, yFilaBottom);

    /* ---- QR ---- */
    let y = yFilaBottom + 0.35;
    if(qrDataUrl){
      const qrSize = 4.3;
      doc.addImage(qrDataUrl, 'PNG', (anchoPagina-qrSize)/2, y, qrSize, qrSize);
      y += qrSize + 0.3;
    }

    /* ---- Barrio (si se pudo detectar) ---- */
    if(p.barrio){
      doc.setFont('helvetica','bold');
      doc.setFontSize(13);
      doc.text(String(p.barrio).toUpperCase(), xMedio, y, { align:'center' });
      y += 0.45;
      doc.line(margen, y, anchoPagina-margen, y);
      y += 0.5;
    } else {
      doc.line(margen, y, anchoPagina-margen, y);
      y += 0.5;
    }

    /* ---- Dirección / Referencia / Destinatario ---- */
    function bloque(titulo, valor, fontSizeValor){
      if(!valor) return;
      doc.setFont('helvetica','bold');
      doc.setFontSize(8);
      doc.text(titulo, margen, y);
      y += 0.42;
      doc.setFont('helvetica','normal');
      doc.setFontSize(fontSizeValor || 10);
      const lineas = doc.splitTextToSize(String(valor), anchoUtil);
      doc.text(lineas, margen, y);
      y += 0.42 * lineas.length + 0.22;
    }

    bloque('DIRECCIÓN', p.direccion);
    bloque('REFERENCIA', p.observaciones);
    bloque('DESTINATARIO', (p.cliente||'') + (p.telefono ? ' · Tel: '+p.telefono : ''));

    doc.save('etiqueta-'+p.numero+'.pdf');
  }catch(err){
    console.error('Error generando la etiqueta PDF', err);
    showToast('Hubo un error generando la etiqueta. Intentá de nuevo.','err');
  }
}

// ---- Pestaña Pedidos: solo pendiente/encamino, agrupados por chofer (ruta) ----
function pedidosAgrupadosHtml(){
  const { texto, rep, mod, soloHoy } = pedidosFiltro;
  const textoLower = texto.toLowerCase();

  let pedidos = state.pedidos.filter(p=>{
    if(!['pendiente','encamino'].includes(p.estado)) return false;
    if(rep && p.repartidorId!==rep) return false;
    if(mod && p.modalidad!==mod) return false;
    if(textoLower && !(p.numero+p.cliente+p.direccion).toLowerCase().includes(textoLower)) return false;
    if(soloHoy && p.fechaEnvio && p.fechaEnvio > hoyKey()) return false; // ruta futura: no corresponde verla todavia
    return true;
  }).sort((a,b)=>{
    // Si a este pedido ya se le calculó un orden de ruta (con "Ordenar ruta"), se respeta ese
    // orden; si no, se ordena por fecha de creación como siempre.
    if(typeof a.ordenRuta === 'number' && typeof b.ordenRuta === 'number') return a.ordenRuta - b.ordenRuta;
    return new Date(a.createdAt) - new Date(b.createdAt);
  });

  const pie = !soloHoy ? '' : `<div class="px-4 py-2 text-xs text-slate-400 border-t border-slate-100">Mostrando pedidos activos de hoy y de días anteriores todavía sin resolver. <button onclick="togglePedidosSoloHoy()" class="text-brand-600 font-semibold hover:underline">Ver también rutas programadas a futuro</button></div>`;

  if(pedidos.length===0){
    return `<div class="text-center text-slate-400 py-14"><i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2"></i>No hay pedidos pendientes o en camino con esos filtros.</div>${pie}`;
  }

  const groups = {};
  pedidos.forEach(p=>{ (groups[p.repartidorId] = groups[p.repartidorId] || []).push(p); });
  const repIds = Object.keys(groups).sort((a,b)=> repartidorNombre(a).localeCompare(repartidorNombre(b), 'es'));

  const bloques = repIds.map(repId=>{
    const lista = groups[repId];
    const bultosTotal = lista.reduce((acc,p)=> acc + (p.modalidad==='mayorista' ? (p.bultos ?? 1) : 0), 0);
    const palletsTotal = lista.reduce((acc,p)=> acc + (p.modalidad==='mayorista' ? (p.pallets ?? 0) : 0), 0);

let reportPreset = '7d'; // hoy | ayer | 7d | 30d | todo | custom
let reportDesdeCustom = '';
let reportHastaCustom = '';

function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function endOfDay(d){ const x = new Date(d); x.setHours(23,59,59,999); return x; }
function getReportRange(){
  const now = new Date();
  if(reportPreset==='hoy') return { desde:startOfDay(now), hasta:endOfDay(now) };
  if(reportPreset==='ayer'){ const y=new Date(now); y.setDate(y.getDate()-1); return { desde:startOfDay(y), hasta:endOfDay(y) }; }
  if(reportPreset==='7d'){ const d=new Date(now); d.setDate(d.getDate()-6); return { desde:startOfDay(d), hasta:endOfDay(now) }; }
  if(reportPreset==='30d'){ const d=new Date(now); d.setDate(d.getDate()-29); return { desde:startOfDay(d), hasta:endOfDay(now) }; }
  if(reportPreset==='custom'){
    const desde = reportDesdeCustom ? startOfDay(new Date(reportDesdeCustom+'T00:00:00')) : null;
    const hasta = reportHastaCustom ? endOfDay(new Date(reportHastaCustom+'T00:00:00')) : null;
    return { desde, hasta };
  }
  return { desde:null, hasta:null }; // todo
}
function inRange(date, desde, hasta){
  const t = new Date(date).getTime();
  if(desde && t < desde.getTime()) return false;
  if(hasta && t > hasta.getTime()) return false;
  return true;
}
function setReportPreset(p){ reportPreset = p; paginaReportesWeb = 1; paginaReportesMayorista = 1; renderAdminTabContent(); }
function setReportCustom(){

function getEntregasDetalle(modalidad, desde, hasta){
  const { texto, rep } = reportesFiltro;

  return state.comprobantes

    .filter(x => x && x.ped.modalidad===modalidad && inRange(x.c.fechaHora, desde, hasta))
    .filter(x => !rep || x.ped.repartidorId===rep)
    .filter(x => !textoLower || (x.ped.numero+x.ped.cliente+x.ped.direccion).toLowerCase().includes(textoLower))
    .sort((a,b)=> new Date(b.c.fechaHora) - new Date(a.c.fechaHora));

function exportarReporteExcel(){
  const { desde, hasta } = getReportRange();
  const web = getEntregasDetalle('web', desde, hasta).map(({ped,c})=>({
    'Chofer': repartidorNombre(ped.repartidorId),
    'Cliente': ped.cliente,
    'Fecha de entrega': fmtFecha(c.fechaHora),
    'Quien recibio': c.nombreReceptor,
    'Cedula': c.cedulaReceptor,
  }));
  const mayorista = getEntregasDetalle('mayorista', desde, hasta).map(({ped,c})=>({
    'Chofer': repartidorNombre(ped.repartidorId),
    'Fecha de entrega': fmtFecha(c.fechaHora),
    'Cliente': ped.cliente,
    'Bultos': ped.bultos ?? 1,
    'Pallets': ped.pallets ?? 0,
  }));
  if(web.length===0 && mayorista.length===0){
    showToast('No hay entregas para exportar en este período.','info');
    return;
  }
  const wb = XLSX.utils.book_new();
  if(web.length){ const wsWeb = XLSX.utils.json_to_sheet(web); XLSX.utils.book_append_sheet(wb, wsWeb, 'Web'); }
  if(mayorista.length){ const wsMay = XLSX.utils.json_to_sheet(mayorista); XLSX.utils.book_append_sheet(wb, wsMay, 'Mayorista'); }
  XLSX.writeFile(wb, 'Trondial_Reporte_'+hoyKey()+'.xlsx');
  showToast('Reporte exportado.');

let clientesFiltro = { texto:'' };
function clientesFiltradosHtml(){
  const q = clientesFiltro.texto.trim().toLowerCase();
  const wrapMsg = (msg) => `<div class="text-center text-slate-400 py-10 text-sm">${msg}</div>`;
  if(q.length < 2){
    return wrapMsg('Escribí al menos 2 letras para buscar entre los ' + state.clientesDB.length.toLocaleString('es-UY') + ' clientes cargados.');
  }
  const matches = state.clientesDB.filter(c =>
    (c.nombre+' '+c.direccion+' '+c.id).toLowerCase().includes(q)
  );
  if(matches.length === 0) return wrapMsg('No se encontraron clientes para "'+clientesFiltro.texto+'".');
  const { items, totalPaginas, paginaActual, total } = paginar(matches, paginaClientes);
  paginaClientes = paginaActual;
  const rows = items.map(c => `
    <tr class="border-t border-slate-100 hover:bg-slate-50/60">
      <td class="px-4 py-3 text-slate-400 text-xs">${c.id}</td>
      <td class="px-4 py-3 font-semibold text-slate-800">${c.nombre}</td>
      <td class="px-4 py-3 text-slate-600">${c.direccion}</td>
      <td class="px-4 py-3 text-slate-600">${c.telefono || '—'}</td>
      <td class="px-4 py-3 text-slate-400 text-xs max-w-[160px] truncate" title="${c.nota||''}">${c.nota || '—'}</td>

        <button onclick="openEditarClienteModal('${c.id}')" class="text-slate-400 hover:text-brand-700 mr-2"><i data-lucide="pencil" class="w-4 h-4"></i></button>
        <button onclick="confirmDeleteCliente('${c.id}')" class="text-slate-400 hover:text-rose-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
      </td>
    </tr>
  `).join('');
  return `
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead><tr class="text-left text-slate-400 text-xs uppercase tracking-wide">
          <th class="px-4 py-2.5">Cuenta</th><th class="px-4 py-2.5">Nombre</th><th class="px-4 py-2.5">Dirección</th>
          <th class="px-4 py-2.5">Teléfono</th><th class="px-4 py-2.5">Nota</th><th class="px-4 py-2.5 text-right">Acciones</th>

        <tbody>${rows}</tbody>
      </table>
    </div>
    ${paginacionHtml(totalPaginas, paginaActual, total, 'irAPaginaClientes')}
  `;
}

function siguienteNumeroPedido(){
  let max = 1000;
  state.pedidos.forEach(p=>{
    const m = /^PED-(\d+)$/.exec(p.numero||'');
    if(m){ const n = parseInt(m[1],10); if(n>max) max = n; }
  });
  return 'PED-' + (max+1);
}

function toggleBultosField(modalidad){
  const wrap = document.getElementById('bultosFieldWrap'); if(!wrap) return;
  const inputBultos = wrap.querySelector('input[name=bultos]');
  const inputPallets = wrap.querySelector('input[name=pallets]');
  if(modalidad==='mayorista'){ wrap.classList.remove('hidden'); if(inputBultos) inputBultos.required = true; }
  else {
    wrap.classList.add('hidden');
    if(inputBultos){ inputBultos.required = false; inputBultos.value=''; }
    if(inputPallets){ inputPallets.value=''; }
  }
}
function crearPedido(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const modalidad = f.get('modalidad');
  const numero = siguienteNumeroPedido();
  const bultos = modalidad==='mayorista' ? (parseInt(f.get('bultos'),10) || 1) : null;
  const pallets = modalidad==='mayorista' ? (parseInt(f.get('pallets'),10) || 0) : null;
  const fechaEnvio = f.get('fechaEnvio') || hoyKey();
  const observaciones = (f.get('observaciones')||'').trim();
  const nuevoPedido = { id: uid('ped'), numero, cliente: f.get('cliente'), direccion: f.get('direccion'), telefono: f.get('telefono'), modalidad, bultos, pallets, observaciones, repartidorId: f.get('repartidorId'), estado:'pendiente', loteId:null, createdAt: new Date().toISOString(), fechaEnvio };
  state.pedidos.push(nuevoPedido);
  fsSet('pedidos', nuevoPedido);
  if(modalidad==='web') autocompletarBarrio_(nuevoPedido);
  closeModal(); showToast('Pedido '+numero+' creado y asignado.'); renderAdmin();
}

let nuevaRuta = { repartidorId:'', fecha:'', stops:[] };

/* ============ ORDEN AUTOMÁTICO DE RUTA (geocodificación + vecino más cercano) ============
   Esto NO es navegación en tiempo real: se calcula una sola vez, al armar la ruta, un orden
   de visita razonable en base a la distancia en línea recta entre direcciones. El chofer o
   el administrador pueden reordenar a mano después si hace falta; es un punto de partida,
   no una ruta exacta con calles y sentidos de tránsito reales. */
const DEPOSITO_DIRECCION = 'Fray Antonio Aldao 575, Montevideo, Uruguay';
let depositoCoords = null; // se geocodifica una sola vez y se guarda en memoria durante la sesión

function geocodificarDireccion_(direccion){
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=uy&q=' + encodeURIComponent(direccion);
  return fetch(url, { headers: { 'Accept-Language': 'es' } })
    .then(r => r.json())
    .then(resultados => {
      if(!resultados || resultados.length === 0) return null;
      return { lat: parseFloat(resultados[0].lat), lng: parseFloat(resultados[0].lon) };
    })
    .catch(() => null);
}

function esperar_(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

// Completa el barrio de un pedido en segundo plano (no bloquea nada), usando el mismo
// servicio gratuito de geocodificación pero pidiéndole el desglose de la dirección.
// Si no encuentra barrio (dirección rara, zona sin mapear, etc.) no hace nada: el campo
// queda vacío y se puede completar a mano desde "Editar pedido".
function autocompletarBarrio_(pedido){
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&countrycodes=uy&q=' + encodeURIComponent(pedido.direccion);
  fetch(url, { headers: { 'Accept-Language': 'es' } })
    .then(r => r.json())
    .then(resultados => {
      if(!resultados || resultados.length === 0) return;
      const addr = resultados[0].address || {};
      const barrio = addr.suburb || addr.neighbourhood || addr.quarter || addr.city_district || '';
      if(!barrio) return;
      pedido.barrio = barrio;
      fsSet('pedidos', pedido);
      if(session && session.role==='admin') renderAdminTabContent();
    })
    .catch(()=>{});
}

function distanciaKm_(a, b){
  // Fórmula de Haversine: distancia en línea recta entre dos puntos (no la distancia real por calle).
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180) * Math.cos(b.lat*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}

async function ordenarRutaAutomaticamente(){
  if(nuevaRuta.stops.length < 2){ showToast('Agregá al menos dos clientes para poder ordenar la ruta.','info'); return; }
  const boton = document.getElementById('btnOrdenarRuta');
  if(boton){ boton.disabled = true; boton.textContent = 'Calculando ruta… puede tardar unos segundos'; }

  try{
    if(!depositoCoords){
      depositoCoords = await geocodificarDireccion_(DEPOSITO_DIRECCION);
      await esperar_(1100);
    }

    // Geocodifica (con caché en el cliente) cada parada que todavía no tenga coordenadas guardadas.
    for(const s of nuevaRuta.stops){
      const cliente = state.clientesDB.find(c => c.id === s.clienteId);
      if(cliente && typeof cliente.lat === 'number' && typeof cliente.lng === 'number'){
        s.lat = cliente.lat; s.lng = cliente.lng;
        continue;
      }
      const coords = await geocodificarDireccion_(s.direccion);
      if(coords){
        s.lat = coords.lat; s.lng = coords.lng;
        if(cliente){ cliente.lat = coords.lat; cliente.lng = coords.lng; fsSet('clientes', cliente); }
      }
      await esperar_(1100); // respeta el límite de uso de Nominatim (~1 consulta por segundo)
    }

    const conCoords = nuevaRuta.stops.filter(s => typeof s.lat === 'number');
    const sinCoords = nuevaRuta.stops.filter(s => typeof s.lat !== 'number');

    if(conCoords.length >= 2 && depositoCoords){
      const ordenados = [];
      const restantes = conCoords.slice();
      let actual = depositoCoords;
      while(restantes.length){
        let mejorIdx = 0, mejorDist = Infinity;
        restantes.forEach((s, i) => {
          const d = distanciaKm_(actual, s);
          if(d < mejorDist){ mejorDist = d; mejorIdx = i; }
        });
        const siguiente = restantes.splice(mejorIdx, 1)[0];
        ordenados.push(siguiente);
        actual = siguiente;
      }
      nuevaRuta.stops = ordenados.concat(sinCoords);
    }

    document.getElementById('rutaBodyWrap').innerHTML = renderRutaStopsYFooter();
    if(window.lucide) lucide.createIcons();

    if(sinCoords.length > 0){
      showToast('Ruta ordenada. '+sinCoords.length+' dirección(es) no se pudo ubicar automáticamente y quedaron al final — revisalas a mano.','info');
    } else {
      showToast('Ruta ordenada según cercanía entre direcciones.');
    }
  } finally {
    // El botón se vuelve a dibujar con renderRutaStopsYFooter, así que no hace falta reactivarlo acá.
  }
}

// Igual que ordenarRutaAutomaticamente(), pero para una ruta que ya está armada en la pestaña
// "Pedidos" (mezclando pedidos web y mayorista de un mismo chofer para hoy), no solo al crearla.
async function ordenarRutaDeChofer(repId){
  const pedidosDelChofer = state.pedidos.filter(p=>{
    if(p.repartidorId!==repId || !['pendiente','encamino'].includes(p.estado)) return false;
    const fecha = p.fechaEnvio || fechaKey(p.createdAt);
    return fecha === hoyKey();
  });
  if(pedidosDelChofer.length < 2){ showToast('Hacen falta al menos dos pedidos pendientes de ese chofer para ordenar la ruta.','info'); return; }

  const boton = document.getElementById('btnOrdenarChofer_'+repId);
  if(boton){ boton.disabled = true; boton.textContent = 'Calculando…'; }

  try{
    if(!depositoCoords){
      depositoCoords = await geocodificarDireccion_(DEPOSITO_DIRECCION);
      await esperar_(1100);
    }
    for(const p of pedidosDelChofer){
      if(typeof p.lat === 'number' && typeof p.lng === 'number') continue;
      const clienteConCoords = state.clientesDB.find(c => c.direccion === p.direccion && typeof c.lat === 'number');
      if(clienteConCoords){ p.lat = clienteConCoords.lat; p.lng = clienteConCoords.lng; continue; }
      const coords = await geocodificarDireccion_(p.direccion);
      if(coords){ p.lat = coords.lat; p.lng = coords.lng; }
      await esperar_(1100);
    }

    const conCoords = pedidosDelChofer.filter(p=> typeof p.lat === 'number');
    const sinCoords = pedidosDelChofer.filter(p=> typeof p.lat !== 'number');

    if(conCoords.length >= 2 && depositoCoords){
      const ordenados = [];
      const restantes = conCoords.slice();
      let actual = depositoCoords;
      while(restantes.length){
        let mejorIdx = 0, mejorDist = Infinity;
        restantes.forEach((p, i) => { const d = distanciaKm_(actual, p); if(d < mejorDist){ mejorDist = d; mejorIdx = i; } });
        const siguiente = restantes.splice(mejorIdx, 1)[0];
        ordenados.push(siguiente);
        actual = siguiente;
      }
      ordenados.concat(sinCoords).forEach((p, idx)=>{ p.ordenRuta = idx; fsSet('pedidos', p); });
    }

    const wrap = document.getElementById('pedidosTableWrap');
    if(wrap) wrap.innerHTML = pedidosAgrupadosHtml();
    if(window.lucide) lucide.createIcons();

    if(sinCoords.length > 0){
      showToast('Ruta de '+repartidorNombre(repId)+' ordenada. '+sinCoords.length+' dirección(es) no se pudo ubicar automáticamente.','info');
    } else {
      showToast('Ruta de '+repartidorNombre(repId)+' ordenada según cercanía.');
    }
  } catch(e){
    console.error('Error ordenando ruta de chofer', e);
    showToast('No se pudo ordenar la ruta. Revisá tu conexión.','err');
    const wrap = document.getElementById('pedidosTableWrap');
    if(wrap) wrap.innerHTML = pedidosAgrupadosHtml();
    if(window.lucide) lucide.createIcons();
  }
}

function teclaBusquedaRuta(e){
  if(e.key==='Enter'){ e.preventDefault(); if(rutaResultados[rutaSel]) agregarClienteARuta(rutaResultados[rutaSel].id); return; }
  if(e.key==='ArrowDown' || e.key==='ArrowUp'){
    e.preventDefault(); if(!rutaResultados.length) return;
    rutaSel = (rutaSel + (e.key==='ArrowDown'?1:-1) + rutaResultados.length) % rutaResultados.length;
    document.querySelectorAll('#rutaResultados [data-idx]').forEach(b=> b.classList.toggle('bg-brand-50', Number(b.dataset.idx)===rutaSel));

let excelPreviewRows = [];
let excelBultosDetectado = false;
function openImportModal(){
  document.getElementById('modalRoot').innerHTML = modalShell('Importar pedidos mayoristas (Excel)', `
    <p class="text-sm text-slate-500 mb-3">El archivo debe tener columnas: <b>cliente</b>, <b>direccion</b>, <b>telefono</b>, <b>bultos</b> y opcionalmente <b>pallets</b>. El número de pedido lo asigna el sistema automáticamente (si tu Excel trae una columna "numero" se ignora).</p>
    <input type="file" id="excelFile" accept=".xlsx,.xls,.csv" onchange="handleExcelFile(event)" class="text-sm mb-3">
    <div id="excelPreviewWrap"></div>
  `, true);
  if(window.lucide) lucide.createIcons();
}
function handleExcelFile(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const wb = XLSX.read(ev.target.result, { type:'binary' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, { defval:'' });
      let bultosDetectado = false;
      excelPreviewRows = json.map(row=>{
        const norm = {}; Object.keys(row).forEach(k=> norm[k.toString().trim().toLowerCase()] = row[k]);
        const bultosRaw = norm.bultos ?? norm['bulto'] ?? norm['cantidad de bultos'] ?? norm['cantidad_bultos'] ?? norm['cant. bultos'] ?? norm['cant bultos'] ?? norm.cantidad ?? norm.unidades ?? '';
        const bultos = parseInt(bultosRaw, 10);
        if(Number.isFinite(bultos) && bultos>0) bultosDetectado = true;
        const palletsRaw = norm.pallets ?? norm['pallet'] ?? norm['cantidad de pallets'] ?? norm['cantidad_pallets'] ?? norm['cant. pallets'] ?? norm['cant pallets'] ?? '';
        const pallets = parseInt(palletsRaw, 10);
        return { cliente: norm.cliente||norm.nombre||'', direccion: norm.direccion||norm['dirección']||'', telefono: (norm.telefono||'').toString(), bultos: Number.isFinite(bultos) && bultos>0 ? bultos : 1, pallets: Number.isFinite(pallets) && pallets>=0 ? pallets : 0 };
      }).filter(r=>r.cliente);
      excelBultosDetectado = bultosDetectado;
      renderExcelPreview();
    }catch(err){ showToast('No se pudo leer el archivo. Verificá el formato.','err'); }
  };
  reader.readAsBinaryString(file);
}
function renderExcelPreview(){
  const wrap = document.getElementById('excelPreviewWrap');
  if(excelPreviewRows.length===0){ wrap.innerHTML = '<p class="text-sm text-rose-500">No se encontraron filas válidas.</p>'; return; }
  const avisoBultos = !excelBultosDetectado ? `
    <div class="text-xs bg-amber-50 text-amber-700 border border-amber-200 rounded-lg px-3 py-2 mb-3 flex items-start gap-1.5">
      <i data-lucide="alert-triangle" class="w-3.5 h-3.5 mt-0.5 shrink-0"></i>
      No se detectó una columna "bultos" en tu archivo (o vino vacía) — se cargó 1 bulto por defecto en todos los pedidos. Si el archivo sí trae la cantidad, revisá que la columna se llame "bultos".
    </div>` : '';
  wrap.innerHTML = `
    ${avisoBultos}
    <div class="border border-slate-200 rounded-lg overflow-hidden mb-3 max-h-60 overflow-y-auto">
      <table class="w-full text-xs"><thead class="bg-slate-50 text-slate-500"><tr><th class="px-2 py-2 text-left">Cliente</th><th class="px-2 py-2 text-left">Dirección</th><th class="px-2 py-2 text-left">Teléfono</th><th class="px-2 py-2 text-left">Bultos</th><th class="px-2 py-2 text-left">Pallets</th></tr></thead>
      <tbody>${excelPreviewRows.map(r=>`<tr class="border-t border-slate-100"><td class="px-2 py-1.5">${r.cliente}</td><td class="px-2 py-1.5">${r.direccion}</td><td class="px-2 py-1.5">${r.telefono}</td><td class="px-2 py-1.5">${r.bultos}</td><td class="px-2 py-1.5">${r.pallets}</td></tr>`).join('')}</tbody></table>
    </div>
    <div class="flex items-center gap-3">
      <label class="text-xs font-semibold text-slate-500">Asignar todo el lote a:</label>
      <select id="loteRep" class="border border-slate-200 rounded-lg px-2 py-1.5 text-sm">${state.repartidores.map(r=>`<option value="${r.id}">${r.nombre}</option>`).join('')}</select>
      <button onclick="confirmarImportacion()" class="ml-auto bg-brand-700 hover:bg-brand-800 text-white text-sm font-semibold px-4 py-2 rounded-lg">Confirmar carga (${excelPreviewRows.length})</button>
    </div>
  `;
}
function confirmarImportacion(){
  const repId = document.getElementById('loteRep').value;
  const loteId = uid('lote');
  const nuevosPedidos = excelPreviewRows.map(r=>{
    const numero = siguienteNumeroPedido();
    const pedido = { id: uid('ped'), numero, cliente: r.cliente, direccion: r.direccion, telefono: r.telefono, modalidad:'mayorista', bultos: r.bultos, pallets: r.pallets ?? 0, observaciones: '', repartidorId: repId, estado:'pendiente', loteId, createdAt: new Date().toISOString(), fechaEnvio: hoyKey() };
    state.pedidos.push(pedido);
    return pedido;
  });
  fsBatchSet('pedidos', nuevosPedidos);
  showToast(excelPreviewRows.length+' pedidos importados correctamente.'); excelPreviewRows=[]; closeModal(); renderAdmin();
}

function renderRepartidorView(){
  const root = document.getElementById('mainRoot');
  const repId = session.repartidorId;
  const misPedidos = state.pedidos.filter(p=>{
      if(p.repartidorId!==repId || p.estado==='anulado' || p.historico) return false;
      const fecha = p.fechaEnvio || fechaKey(p.createdAt);
      return fecha === hoyKey(); // solo la ruta de HOY: nada de pendientes ni entregas de otros dias
    })
    .sort((a,b)=>{
      const ord={encamino:0,pendiente:1,noentregado:2,entregado:3};
      const diff = (ord[a.estado]??9)-(ord[b.estado]??9);
      if(diff !== 0) return diff;
      // Dentro del mismo estado, respeta el orden de la ruta (si se armó con "Ordenar ruta automáticamente").
      if(typeof a.ordenRuta === 'number' && typeof b.ordenRuta === 'number') return a.ordenRuta - b.ordenRuta;

    });

    <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
      <div>
        <h2 class="text-lg font-extrabold text-slate-900">Hola, ${repartidorNombre(repId).split(' ')[0]}</h2>

          <i data-lucide="${offlineMode?'wifi-off':'wifi'}" class="w-3.5 h-3.5"></i>${offlineMode?'Sin conexión':'Conectado'}${pendingSync.length?' · '+pendingSync.length+' por sincronizar':''}
        </button>
        <span title="La app comparte tu ubicación con el administrador mientras la tengas abierta, para que pueda ver dónde estás. Se apaga solo si cerrás sesión." class="flex items-center gap-1.5 text-xs font-semibold px-3 py-2 rounded-full border bg-sky-50 border-sky-200 text-sky-700">
          <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>Compartiendo ubicación
        </span>
      </div>
    </div>
    <button onclick="abrirEscanerModal()" class="w-full mb-5 inline-flex items-center justify-center gap-2 bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm px-4 py-3 rounded-xl"><i data-lucide="qr-code" class="w-4 h-4"></i>Escanear pedido</button>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
      ${misPedidos.map(pedidoCard).join('') || '<p class="text-slate-400 col-span-full text-center py-10">No tenés pedidos asignados.</p>'}

  if(p.estado==='pendiente') return `<button onclick="cambiarEstado('${p.id}','encamino')" class="flex-1 min-w-[130px] inline-flex items-center justify-center gap-1.5 bg-brand-700 hover:bg-brand-800 text-white text-sm font-semibold px-3 py-2 rounded-lg"><i data-lucide="play" class="w-4 h-4"></i>Iniciar viaje</button>`;

function cambiarEstado(id, nuevo){
  const p = state.pedidos.find(x=>x.id===id); if(!p) return;
  p.estado = nuevo;
  fsUpdate('pedidos', p.id, { estado: nuevo });
  if(offlineMode) pendingSync.push(id);

  if(nuevo==='encamino'){
    capturarUbicacionPuntual(ubic=>{
      if(!ubic) return;
      const actual = state.pedidos.find(x=>x.id===id); if(!actual) return;
      actual.ubicacionInicioViaje = ubic;
      fsUpdate('pedidos', actual.id, { ubicacionInicioViaje: ubic });
    });
  }
}

/* ============ ESCANEO DE QR (chofer) ============ */
let escanerActivo = null;
function abrirEscanerModal(){
  document.getElementById('modalRoot').innerHTML = modalShell('Escanear pedido', `
    <div id="qrReader" class="w-full"></div>
    <p class="text-xs text-slate-400 mt-3 text-center">Apuntá la cámara al código QR de la etiqueta pegada en el pedido.</p>
  `, true);
  if(window.lucide) lucide.createIcons();
  iniciarEscaner();
}
function iniciarEscaner(){
  if(typeof Html5Qrcode === 'undefined'){
    showToast('No se pudo abrir la cámara: revisá tu conexión a internet.','err');
    closeModal();
    return;
  }
  escanerActivo = new Html5Qrcode('qrReader');
  escanerActivo.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: 230 },
    (decodedText)=>{ onEscaneoExitoso(decodedText); },
    ()=>{ /* no se detectó QR en este cuadro, se sigue intentando */ }
  ).catch(err=>{
    console.error('Error abriendo la cámara', err);
    showToast('No se pudo abrir la cámara. Revisá que le hayas dado permiso al navegador.','err');
    escanerActivo = null;
    closeModal();
  });
}
function detenerEscaner(){
  if(!escanerActivo) return;
  const activo = escanerActivo;
  escanerActivo = null;
  activo.stop().then(()=>activo.clear()).catch(()=>{});
}
function onEscaneoExitoso(decodedText){
  if(!escanerActivo) return; // ya se procesó este escaneo, evita duplicados
  const activo = escanerActivo;
  escanerActivo = null;
  activo.stop().then(()=>activo.clear()).catch(()=>{});
  closeModal();
  procesarEscaneoQR(decodedText);
}
function procesarEscaneoQR(numero){
  numero = (numero || '').trim();
  const p = state.pedidos.find(x=>x.numero===numero);
  if(!p){ showToast('No se encontró ningún pedido con ese código.','err'); return; }
  if(p.repartidorId !== session.repartidorId){ showToast('Ese pedido no está asignado a tu ruta.','err'); return; }
  if(p.estado==='entregado'){ showToast('El pedido '+p.numero+' ya figura como entregado.','info'); return; }
  if(p.estado==='anulado'){ showToast('El pedido '+p.numero+' fue anulado.','err'); return; }
  if(p.estado==='noentregado'){ showToast('El pedido '+p.numero+' quedó como no entregado, está en revisión del administrador.','info'); return; }
  if(p.estado==='pendiente'){
    cambiarEstado(p.id, 'encamino');
    showToast('Pedido '+p.numero+' iniciado.');
  } else if(p.estado==='encamino'){
    openComprobanteModal(p.id);
  }
}
function openComprobanteModal(pedidoId){
  const p = state.pedidos.find(x=>x.id===pedidoId);
  if(p && p.modalidad==='mayorista'){ pasoBultos(pedidoId); return; }
  pasoReceptor(pedidoId, null);
}
// Paso 1 (mayoristas): cuántos bultos se entregan
function pasoBultos(pedidoId){
  const p = state.pedidos.find(x=>x.id===pedidoId);
  document.getElementById('modalRoot').innerHTML = modalShell('Confirmar entrega · bultos', `
    <form onsubmit="event.preventDefault(); validarBultos('${pedidoId}')" class="space-y-3">
      <p class="text-sm text-slate-600">${esc(p.cliente)} · pedido de <b>${Number(p.bultos||0)} bulto${Number(p.bultos||0)===1?'':'s'}</b>${Number(p.pallets||0)?` y ${p.pallets} pallet${p.pallets>1?'s':''}`:''}.</p>
      <div><label class="text-xs font-semibold text-slate-500">¿Cuántos bultos estás entregando?</label>
        <input id="bultosEntregados" type="number" inputmode="numeric" min="0" required value="${Number(p.bultos||0)}" class="w-full border border-slate-200 rounded-lg px-3 py-3 text-2xl font-bold text-center mt-1"></div>
      ${Number(p.pallets||0)?`<div><label class="text-xs font-semibold text-slate-500">¿Cuántos pallets?</label><input id="palletsEntregados" type="number" inputmode="numeric" min="0" value="${Number(p.pallets||0)}" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-lg font-bold text-center mt-1"></div>`:''}
      <div id="bultosMsg" class="text-sm min-h-[1.25rem]"></div>
      <button class="w-full mt-2 bg-brand-700 hover:bg-brand-800 text-white font-semibold py-2.5 rounded-lg">Siguiente</button>
    </form>
  `);
  if(window.lucide) lucide.createIcons();
  setTimeout(()=>{ const el=document.getElementById('bultosEntregados'); if(el){ el.focus(); el.select(); } }, 50);
}
function validarBultos(pedidoId){
  const p = state.pedidos.find(x=>x.id===pedidoId);
  const b = parseInt(document.getElementById('bultosEntregados').value, 10);
  const palEl = document.getElementById('palletsEntregados'), pal = palEl ? parseInt(palEl.value,10) : null;
  if(!Number.isFinite(b) || b < 0){ document.getElementById('bultosMsg').innerHTML='<span class="text-rose-600">Poné cuántos bultos entregás.</span>'; return; }
  const dif = b - Number(p.bultos||0);
  if(dif !== 0 && !document.getElementById('bultosMsg').dataset.ok){
    document.getElementById('bultosMsg').dataset.ok = '1';
    document.getElementById('bultosMsg').innerHTML = `<span class="text-amber-700 font-semibold">Ojo: el pedido es de ${Number(p.bultos||0)} y estás entregando ${b} (${dif>0?'+':''}${dif}). Si es correcto, tocá Siguiente otra vez.</span>`;
    return;
  }
  pasoReceptor(pedidoId, { bultos:b, pallets: pal });
}
// Paso 2: nombre y cédula de quien recibe
let entregaBultos = null;
function pasoReceptor(pedidoId, bultos){
  entregaBultos = bultos;
  const p = state.pedidos.find(x=>x.id===pedidoId);
  document.getElementById('modalRoot').innerHTML = modalShell('Confirmar entrega', `
    <form onsubmit="confirmarEntrega(event, '${pedidoId}')" class="space-y-3">
      ${bultos?`<div class="text-sm bg-slate-50 rounded-lg px-3 py-2">Bultos entregados: <b>${bultos.bultos}</b>${bultos.pallets!=null?` · pallets: <b>${bultos.pallets}</b>`:''} <button type="button" onclick="pasoBultos('${pedidoId}')" class="text-brand-700 font-semibold underline ml-1">cambiar</button></div>`:''}
      <div><label class="text-xs font-semibold text-slate-500">Nombre de quien recibe</label><input required id="nombreReceptor" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1"></div>
      <div>
        <label class="text-xs font-semibold text-slate-500">Cédula de identidad</label>
        <input required id="cedulaReceptor" placeholder="Ej: 4123456-7" oninput="checkCedula()" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1">
        <div id="cedulaMsg" class="text-xs mt-1 text-slate-400">Formato uruguayo: 7-8 dígitos.</div>
      </div>
      <button class="w-full mt-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg">Confirmar entrega</button>
    </form>
  `);
  if(window.lucide) lucide.createIcons();
  setTimeout(()=>{ const el=document.getElementById('nombreReceptor'); if(el) el.focus(); }, 50);
}
function checkCedula(){
  const v = document.getElementById('cedulaReceptor').value;
  const res = validarCedulaUY(v);
  const msg = document.getElementById('cedulaMsg');
  msg.textContent = res.motivo;
  msg.className = 'text-xs mt-1 ' + (res.valido ? 'text-emerald-600' : 'text-rose-500');
}
function confirmarEntrega(e, pedidoId){
  e.preventDefault();
  const nombre = document.getElementById('nombreReceptor').value;
  const cedula = document.getElementById('cedulaReceptor').value;
  const res = validarCedulaUY(cedula);
  if(!res.valido){ showToast('Cédula inválida: '+res.motivo,'err'); return; }
  const comprobante = { id: uid('cmp'), pedidoId, repartidorId: (session && session.repartidorId) || null, fecha: hoyKey(), nombreReceptor: nombre, cedulaReceptor: cedula, fechaHora: new Date().toISOString() };
  if(entregaBultos){ comprobante.bultosEntregados = entregaBultos.bultos; if(entregaBultos.pallets!=null) comprobante.palletsEntregados = entregaBultos.pallets; }
  entregaBultos = null;
  state.comprobantes.push(comprobante);
  const p = state.pedidos.find(x=>x.id===pedidoId); p.estado='entregado';
  fsSet('comprobantes', comprobante);
  fsUpdate('pedidos', p.id, { estado: 'entregado' });
  if(offlineMode) pendingSync.push(pedidoId);
  closeModal();
  showToast(offlineMode ? 'Comprobante guardado en el celular.' : 'Entrega confirmada.');
  renderRepartidorView(); if(window.lucide) lucide.createIcons();
  capturarUbicacionPuntual(ubic=>{
    if(!ubic) return;
    const actual = state.comprobantes.find(x=>x.id===comprobante.id); if(!actual) return;
    actual.ubicacion = ubic;
    fsSet('comprobantes', actual);
  });
}
function openNoEntregadoModal(pedidoId){
  document.getElementById('modalRoot').innerHTML = modalShell('¿Por qué no se pudo entregar?', `
    <form onsubmit="confirmarNoEntrega(event, '${pedidoId}')" class="space-y-3">
      <select required id="motivoNoEntrega" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">
        <option value="">Elegí un motivo</option>
        <option>Cliente ausente</option><option>Dirección incorrecta</option><option>Rechazado por el cliente</option><option>Otro</option>
      </select>
      <button class="w-full mt-2 bg-rose-600 hover:bg-rose-700 text-white font-semibold py-2.5 rounded-lg">Registrar intento fallido</button>
    </form>
  `);
  if(window.lucide) lucide.createIcons();
}
function confirmarNoEntrega(e, pedidoId){
  e.preventDefault();
  const motivo = document.getElementById('motivoNoEntrega').value;
  const intento = { id: uid('int'), pedidoId, motivo, fecha: hoyKey(), fechaHora: new Date().toISOString(), repartidorId: session.repartidorId, resolucion:null };
  state.intentos.push(intento);
  const p = state.pedidos.find(x=>x.id===pedidoId); p.estado='noentregado';
  fsSet('intentos', intento);
  fsUpdate('pedidos', p.id, { estado: 'noentregado' });
  if(offlineMode) pendingSync.push(pedidoId);
  closeModal(); showToast('Intento registrado. Vuelve a "Pendiente" para revisión del administrador mañana.','info');
  renderRepartidorView(); if(window.lucide) lucide.createIcons();
  capturarUbicacionPuntual(ubic=>{
    if(!ubic) return;
    const actual = state.intentos.find(x=>x.id===intento.id); if(!actual) return;
    actual.ubicacion = ubic;
    fsSet('intentos', actual);
  });
}

/* ============ INIT ============ */
// Evita que el botón "atrás" del navegador/celular navegue afuera de la app (lo que en
// algunos celulares se sentía como un cierre de sesión inesperado). La única forma de
// salir de la sesión debe ser el botón "Cerrar sesión".
history.pushState({ app:true }, '', location.href);
window.addEventListener('popstate', function(){
  history.pushState({ app:true }, '', location.href);
});

renderAll();
</script>
